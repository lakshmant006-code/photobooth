<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Photobooth</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0c0c0d" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Photobooth" />

<style>
  :root {
    --bg: #0a0a0b; --panel: #18181b; --panel2: #222226;
    --ink: #f2ede4; --dim: #7e7a73; --dim2: #a09c95;
    --line: #2c2c30; --danger: #e07575; --ok: #6fad8a;
    --accent: #f2ede4; --tap: 60px; --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
  }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

  main {
    max-width: 480px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 130px);
  }

  /* ── Header ── */
  header { text-align: center; margin-bottom: 32px; }
  .logo { font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--dim2); margin: 0 0 10px; }
  h1 { font-size: 30px; font-weight: 300; letter-spacing: -0.01em; margin: 0 0 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; font-size: 12px; color: var(--dim2);
  }
  .badge svg { width: 12px; height: 12px; stroke: var(--ok); fill: none; stroke-width: 2.5; }

  /* ── Add buttons ── */
  .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    min-height: 120px; border: 1.5px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 500; padding: 16px;
    transition: border-color .15s, background .15s, transform .1s;
    -webkit-user-select: none; user-select: none;
  }
  .add-btn:active { background: var(--panel2); border-color: var(--dim2); transform: scale(0.97); }
  .add-btn svg { width: 32px; height: 32px; stroke: var(--ink); fill: none; stroke-width: 1.4; opacity: .85; }
  .add-btn .sub { color: var(--dim); font-size: 12px; font-weight: 400; }
  input[type=file] { display: none; }

  /* ── Photo slots / progress ── */
  .slots-label {
    display: flex; align-items: center; justify-content: space-between;
    margin: 24px 0 10px;
  }
  .slots-label span { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); }
  .slots-label .count-badge {
    font-size: 12px; font-weight: 600; color: var(--dim2);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px;
  }
  .slots-label .count-badge.ready { color: var(--ok); border-color: var(--ok); }
  .slots-label .count-badge.warn  { color: var(--danger); border-color: var(--danger); }

  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thumb {
    position: relative; aspect-ratio: 3/4; background: var(--panel);
    border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden;
    transition: border-color .15s;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .num {
    position: absolute; left: 7px; top: 7px;
    background: rgba(0,0,0,.7); color: var(--ink); backdrop-filter: blur(4px);
    font-size: 11px; font-weight: 700; border-radius: 999px;
    min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0 6px;
  }
  .thumb button.rm {
    position: absolute; top: 6px; right: 6px; width: 34px; height: 34px;
    border-radius: 999px; border: none; background: rgba(0,0,0,.72); color: var(--ink);
    backdrop-filter: blur(4px); font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, transform .1s;
  }
  .thumb button.rm:active { background: rgba(0,0,0,.9); transform: scale(0.9); }

  /* ── Layout picker ── */
  .section-label { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); margin: 28px 0 10px; }
  .pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pill {
    min-height: 56px; padding: 10px 6px; text-align: center;
    border: 1.5px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--ink); font-family: inherit;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .pill:active { transform: scale(0.96); }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .pill .hint { display: block; font-size: 10px; font-weight: 400; opacity: .6; }
  .pill[aria-pressed="true"] .hint { opacity: .5; }

  /* ── Action bar ── */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .actionbar-inner { max-width: 480px; margin: 0 auto; }
  .generate {
    width: 100%; min-height: var(--tap); border: none; border-radius: var(--radius);
    background: var(--ink); color: var(--bg); font-family: inherit;
    font-size: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .generate:disabled { opacity: .28; cursor: default; }
  .generate:active:not(:disabled) { opacity: .88; transform: scale(0.98); }

  /* ── Status ── */
  .status { text-align: center; margin-top: 16px; color: var(--dim2); font-size: 14px; min-height: 22px; }
  .status.error { color: var(--danger); }
  .spinner {
    display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px;
    border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Result ── */
  .result { margin-top: 32px; text-align: center; }
  .result img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  .result-actions { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result-actions .full { grid-column: 1 / -1; }
  .rbtn {
    min-height: var(--tap); display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1.5px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--ink); font-family: inherit;
    font-size: 15px; font-weight: 500; cursor: pointer; text-decoration: none;
    transition: background .12s, transform .1s;
  }
  .rbtn:active { background: var(--panel2); transform: scale(0.97); }
  .rbtn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .rbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  footer { margin-top: 40px; text-align: center; color: var(--dim); font-size: 11px; letter-spacing: .05em; line-height: 1.8; }
</style>
</head>
<body>
<main>
  <header>
    <p class="logo">Photobooth</p>
    <h1>Make your strip</h1>
    <span class="badge">
      <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
      Photos never leave this device
    </span>
  </header>

  <div class="add-row">
    <button class="add-btn" id="cameraBtn" type="button" aria-label="Take a photo with your camera">
      <svg viewBox="0 0 24 24"><path d="M3 9h3l1.5-2.5h9L18 9h3v11H3z"/><circle cx="12" cy="14" r="3.2"/></svg>
      <span>Camera</span>
      <span class="sub">take a photo</span>
    </button>
    <button class="add-btn" id="libraryBtn" type="button" aria-label="Choose photos from your library">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 14l5-4 4 3 3-2 6 5"/></svg>
      <span>Library</span>
      <span class="sub">pick from photos</span>
    </button>
  </div>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" />
  <input id="libraryInput" type="file" accept="image/*" multiple />

  <div class="slots-label">
    <span>Photos</span>
    <span id="count" class="count-badge">0 / 6</span>
  </div>
  <div id="thumbs" class="thumbs"></div>

  <div class="section-label">Layout</div>
  <div class="pills" id="pills" role="group" aria-label="Layout options">
    <button class="pill" data-layout="auto" aria-pressed="true">Auto<span class="hint">smart pick</span></button>
    <button class="pill" data-layout="strip" aria-pressed="false">Strip<span class="hint">vertical</span></button>
    <button class="pill" data-layout="grid" aria-pressed="false">Grid<span class="hint">2 × 2</span></button>
    <button class="pill" data-layout="collage" aria-pressed="false">Collage<span class="hint">3 × 2</span></button>
  </div>

  <div id="result" class="result" style="display:none">
    <img id="resultImg" alt="Your photobooth strip" />
    <div class="result-actions">
      <button id="shareBtn" class="rbtn primary full" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 3v13"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
        Save / Share
      </button>
      <a id="downloadBtn" class="rbtn" download="photobooth.jpg">
        <svg viewBox="0 0 24 24"><path d="M12 3v13"/><path d="M8 12l4 4 4-4"/><path d="M5 19h14"/></svg>
        Download
      </a>
      <button id="againBtn" class="rbtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9H9"/><path d="M9 7l-3 3-3-3"/></svg>
        Start over
      </button>
    </div>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <footer>Runs entirely on your device &middot; No AI face changes &middot; No uploads</footer>
</main>

<div class="actionbar"><div class="actionbar-inner">
  <button id="generate" class="generate" disabled>Generate</button>
</div></div>

<script>
"use strict";

// ============================================================================
// FILTER — ported from the Python pipeline. Runs entirely in the browser.
// Constants match filter_pipeline.py exactly.
// ============================================================================

const P = {
  TARGET_SHORT_EDGE: 1000,
  BLACK_POINT: 5.0, WHITE_POINT: 250.0, SHADOW_CRUSH: 1.45,
  MIDTONE_LIFT: 1.02, HIGHLIGHT_ROLLOFF: 0.93,
  SHADOW_TINT: [-1, -1, 1], HIGHLIGHT_TINT: [-2, -1, 3],
  FLASH_INTENSITY: 0.07, FLASH_CENTER: [0.5, 0.45], FLASH_RADIUS: 0.58, FLASH_SOFTNESS: 1.9,
  BLUR_RADIUS: 0.5,
  GRAIN_INTENSITY: 21.0,
  SCAN_INTENSITY: 4.5, DUST_DENSITY: 0.00015, SCRATCH_COUNT: 4,
  VIGNETTE_STRENGTH: 0.65, VIGNETTE_RADIUS: 0.60, VIGNETTE_SOFTNESS: 1.6,
  PAPER: [14, 12, 11],
};

const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

// Approx standard-normal via sum of uniforms (fast; good enough for grain)
function gaussish() { return (Math.random() + Math.random() + Math.random() - 1.5) * 1.1547; }

// 256-entry tone curve LUT, matches _build_tone_lut()
function buildToneLUT() {
  const lut = new Uint8ClampedArray(256);
  const bp = P.BLACK_POINT / 255, wp = P.WHITE_POINT / 255;
  for (let i = 0; i < 256; i++) {
    let x = i / 255;
    let y = clamp((x - bp) / (wp - bp), 0, 1);
    if (y < 0.5) y = Math.pow(y * 2, P.SHADOW_CRUSH) / 2;
    y = clamp(y * P.MIDTONE_LIFT, 0, 1);
    const knee = 0.75;
    if (y > knee) y = knee + (y - knee) * P.HIGHLIGHT_ROLLOFF;
    lut[i] = Math.round(clamp(y, 0, 1) * 255);
  }
  return lut;
}
const TONE_LUT = buildToneLUT();

// Stage 1+2+3: B&W duotone -> tone curve -> flash, all in one pixel pass
function passColorAndFlash(data, w, h) {
  const cx = P.FLASH_CENTER[0] * w, cy = P.FLASH_CENTER[1] * h;
  const halfDiag = Math.sqrt(w * w + h * h) / 2;
  const [sr, sg, sb] = P.SHADOW_TINT, [hr, hg, hb] = P.HIGHLIGHT_TINT;
  for (let y = 0; y < h; y++) {
    const dy = y - cy;
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const r = data[idx], g = data[idx + 1], b = data[idx + 2];
      // luma (Rec.709)
      const luma = clamp(0.2126 * r + 0.7152 * g + 0.0722 * b, 0, 255);
      const t = luma / 255;
      // duotone tint
      let cr = luma + (sr * (1 - t) + hr * t);
      let cg = luma + (sg * (1 - t) + hg * t);
      let cb = luma + (sb * (1 - t) + hb * t);
      // tone curve LUT
      cr = TONE_LUT[clamp(cr, 0, 255) | 0];
      cg = TONE_LUT[clamp(cg, 0, 255) | 0];
      cb = TONE_LUT[clamp(cb, 0, 255) | 0];
      // flash hotspot
      const dx = x - cx;
      const dist = Math.sqrt(dx * dx + dy * dy) / halfDiag;
      let m = 1 - Math.pow(clamp(dist / P.FLASH_RADIUS, 0, 1), P.FLASH_SOFTNESS);
      m = m * P.FLASH_INTENSITY;
      data[idx]     = cr + (255 - cr) * m;
      data[idx + 1] = cg + (255 - cg) * m;
      data[idx + 2] = cb + (255 - cb) * m;
    }
  }
}

// Stage 5+6(scan)+7: grain + scan-line banding + vignette in one pass
function passGrainScanVignette(data, w, h) {
  const cx = w / 2, cy = h / 2;
  const halfDiag = Math.sqrt(w * w + h * h) / 2;
  // precompute smoothed per-row scan offset
  const raw = new Float32Array(h);
  for (let y = 0; y < h; y++) raw[y] = gaussish();
  const scan = new Float32Array(h);
  for (let y = 0; y < h; y++) {
    const a = raw[Math.max(0, y - 1)], b = raw[y], c = raw[Math.min(h - 1, y + 1)];
    scan[y] = (0.2 * a + 0.6 * b + 0.2 * c) * P.SCAN_INTENSITY;
  }
  for (let y = 0; y < h; y++) {
    const dy = y - cy;
    const rowScan = scan[y];
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const v = data[idx]; // ~monochrome, use red channel for luma proxy
      // grain modulated by luminance
      const lum = v / 255;
      const mod = clamp(1 - Math.abs(lum - 0.5) * 1.4, 0.25, 1);
      const noise = gaussish() * P.GRAIN_INTENSITY * mod + rowScan;
      // vignette
      const dx = x - cx;
      const dist = Math.sqrt(dx * dx + dy * dy) / halfDiag;
      let fall = clamp((dist - P.VIGNETTE_RADIUS) / (1 - P.VIGNETTE_RADIUS + 1e-6), 0, 1);
      fall = Math.pow(fall, 1 / P.VIGNETTE_SOFTNESS);
      const vmask = 1 - fall * P.VIGNETTE_STRENGTH;
      data[idx]     = clamp((data[idx] + noise) * vmask, 0, 255);
      data[idx + 1] = clamp((data[idx + 1] + noise) * vmask, 0, 255);
      data[idx + 2] = clamp((data[idx + 2] + noise) * vmask, 0, 255);
    }
  }
}

// Stage 6 (dust + scratches) as canvas overlay drawing (lighter blend)
function drawTexture(ctx, w, h) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  // dust specks
  const n = Math.round(w * h * P.DUST_DENSITY);
  for (let i = 0; i < n; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const bright = 40 + Math.random() * 80;
    ctx.fillStyle = `rgb(${bright|0},${bright|0},${bright|0})`;
    ctx.fillRect(x, y, 1, 1);
  }
  // scratches: probabilistic count (binomial(3, 0.45))
  let count = 0;
  for (let k = 0; k < P.SCRATCH_COUNT; k++) if (Math.random() < 0.50) count++;
  for (let s = 0; s < count; s++) {
    const x = Math.random() * w;
    const yStart = Math.random() * (h / 2);
    const yEnd = h / 2 + Math.random() * (h / 2);
    const base = 25 + Math.random() * 40;
    ctx.strokeStyle = `rgba(${base|0},${base|0},${base|0},0.5)`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yStart); ctx.lineTo(x, yEnd); ctx.stroke();
  }
  ctx.restore();
}

// Full pipeline for one image (already drawn to `canvas` at processing size)
function processCanvas(canvas) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  // pass 1: color + tone + flash
  let img = ctx.getImageData(0, 0, w, h);
  passColorAndFlash(img.data, w, h);
  ctx.putImageData(img, 0, 0);

  // stage 4: soft blur via canvas filter (draw through a temp canvas)
  if (P.BLUR_RADIUS > 0) {
    const tmp = document.createElement("canvas");
    tmp.width = w; tmp.height = h;
    const tctx = tmp.getContext("2d");
    tctx.filter = `blur(${P.BLUR_RADIUS}px)`;
    tctx.drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(tmp, 0, 0);
  }

  // pass 2: grain + scan + vignette
  img = ctx.getImageData(0, 0, w, h);
  passGrainScanVignette(img.data, w, h);
  ctx.putImageData(img, 0, 0);

  // texture overlay (dust + scratches)
  drawTexture(ctx, w, h);
  return canvas;
}

// ============================================================================
// Image loading + resize (EXIF handled by createImageBitmap)
// ============================================================================

async function loadToCanvas(file) {
  // imageOrientation 'from-image' auto-applies EXIF rotation
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch (e) {
    bmp = await createImageBitmap(file);
  }
  // resize so short edge == TARGET_SHORT_EDGE
  const short = Math.min(bmp.width, bmp.height);
  const scale = P.TARGET_SHORT_EDGE / short;
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  return c;
}

// ============================================================================
// Composition: strip / grid / collage  (matches compose_* in Python)
// ============================================================================

function coverCrop(srcCanvas, tw, th) {
  const out = document.createElement("canvas");
  out.width = tw; out.height = th;
  const ctx = out.getContext("2d");
  const sr = srcCanvas.width / srcCanvas.height, dr = tw / th;
  let dw, dh;
  if (sr > dr) { dh = th; dw = th * sr; } else { dw = tw; dh = tw / sr; }
  ctx.drawImage(srcCanvas, (tw - dw) / 2, (th - dh) / 2, dw, dh);
  return out;
}

function newPaper(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = `rgb(${P.PAPER[0]},${P.PAPER[1]},${P.PAPER[2]})`;
  ctx.fillRect(0, 0, w, h);
  return c;
}

function composeStrip(canvases) { // 4 imgs, doubled
  const cw = 600, ch = 450, border = 30, gap = 12, inter = 20;
  const cells = canvases.map(c => coverCrop(c, cw, ch));
  const sw = cw + 2 * border, sh = 4 * ch + 3 * gap + 2 * border;
  const strip = newPaper(sw, sh);
  const sctx = strip.getContext("2d");
  let y = border;
  for (const cell of cells) { sctx.drawImage(cell, border, y); y += ch + gap; }
  const out = newPaper(2 * sw + inter, sh);
  const octx = out.getContext("2d");
  octx.drawImage(strip, 0, 0); octx.drawImage(strip, sw + inter, 0);
  return out;
}

function composeGrid(canvases) { // 4 imgs, 2x2
  const cell = 600, border = 30, gap = 12;
  const cells = canvases.map(c => coverCrop(c, cell, cell));
  const gw = 2 * cell + gap + 2 * border;
  const grid = newPaper(gw, gw);
  const ctx = grid.getContext("2d");
  cells.forEach((c, i) => {
    const row = Math.floor(i / 2), col = i % 2;
    ctx.drawImage(c, border + col * (cell + gap), border + row * (cell + gap));
  });
  return grid;
}

function composeCollage(canvases) { // 6 imgs, 3x2
  const cw = 500, ch = 400, border = 30, gap = 12;
  const cells = canvases.map(c => coverCrop(c, cw, ch));
  const gw = 3 * cw + 2 * gap + 2 * border, gh = 2 * ch + gap + 2 * border;
  const grid = newPaper(gw, gh);
  const ctx = grid.getContext("2d");
  cells.forEach((c, i) => {
    const row = Math.floor(i / 3), col = i % 3;
    ctx.drawImage(c, border + col * (cw + gap), border + row * (ch + gap));
  });
  return grid;
}

function padTo(canvases, target) {
  const out = canvases.slice();
  while (out.length < target) out.push(canvases[out.length % canvases.length]);
  return out;
}

function composeAuto(canvases) {
  const n = canvases.length;
  if (n >= 5) return composeCollage(padTo(canvases, 6));
  return composeStrip(padTo(canvases, 4));
}

function canvasToBlob(canvas) {
  return new Promise((res) => canvas.toBlob((b) => res(b), "image/jpeg", 0.92));
}

// ============================================================================
// UI wiring
// ============================================================================

const MIN_N = 1, MAX_N = 6;
let queue = [];          // {file, url}
let currentLayout = "auto";
let resultBlob = null;

const $ = (id) => document.getElementById(id);
const cameraBtn = $("cameraBtn"), libraryBtn = $("libraryBtn");
const cameraInput = $("cameraInput"), libraryInput = $("libraryInput");
const thumbs = $("thumbs"), countEl = $("count"), pills = $("pills");
const generate = $("generate"), status = $("status");
const result = $("result"), resultImg = $("resultImg");
const shareBtn = $("shareBtn"), downloadBtn = $("downloadBtn"), againBtn = $("againBtn");

function renderThumbs() {
  thumbs.innerHTML = "";
  queue.forEach((item, idx) => {
    const div = document.createElement("div"); div.className = "thumb";
    const img = document.createElement("img"); img.src = item.url; img.alt = ""; div.appendChild(img);
    const num = document.createElement("span"); num.className = "num"; num.textContent = idx + 1; div.appendChild(num);
    const rm = document.createElement("button"); rm.className = "rm"; rm.type = "button"; rm.textContent = "\u00d7";
    rm.addEventListener("click", () => { URL.revokeObjectURL(item.url); queue.splice(idx, 1); renderThumbs(); });
    div.appendChild(rm); thumbs.appendChild(div);
  });
  updateCount();
}
function updateCount() {
  const n = queue.length;
  generate.disabled = !(n >= MIN_N && n <= MAX_N);
  if (n > MAX_N) {
    countEl.textContent = n + " / " + MAX_N + "  remove " + (n - MAX_N);
    countEl.className = "count-badge warn";
  } else if (n >= MIN_N) {
    countEl.textContent = n + " / " + MAX_N + "  ready";
    countEl.className = "count-badge ready";
  } else {
    countEl.textContent = n + " / " + MAX_N;
    countEl.className = "count-badge";
  }
}
function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith("image/")) continue;
    if (queue.length >= MAX_N) { status.textContent = "Max " + MAX_N + " photos."; break; }
    queue.push({ file: f, url: URL.createObjectURL(f) });
  }
  renderThumbs();
}
cameraBtn.addEventListener("click", () => cameraInput.click());
libraryBtn.addEventListener("click", () => libraryInput.click());
cameraInput.addEventListener("change", (e) => { addFiles(e.target.files); cameraInput.value = ""; });
libraryInput.addEventListener("change", (e) => { addFiles(e.target.files); libraryInput.value = ""; });
pills.addEventListener("click", (e) => {
  const btn = e.target.closest(".pill"); if (!btn) return;
  currentLayout = btn.dataset.layout;
  [...pills.children].forEach((p) => p.setAttribute("aria-pressed", p === btn ? "true" : "false"));
});

generate.addEventListener("click", async () => {
  const n = queue.length;
  if (n < MIN_N || n > MAX_N) return;
  if ((currentLayout === "strip" || currentLayout === "grid") && n > 4) {
    status.className = "status error"; status.textContent = currentLayout + " uses up to 4 photos (you have " + n + "). Try Auto or remove some."; return;
  }
  generate.disabled = true; result.style.display = "none";
  status.className = "status"; status.innerHTML = '<span class="spinner"></span>developing your strip\u2026';
  // let the spinner paint
  await new Promise((r) => setTimeout(r, 30));
  try {
    const processed = [];
    for (const item of queue) {
      const c = await loadToCanvas(item.file);
      processed.push(processCanvas(c));
      await new Promise((r) => setTimeout(r, 0)); // yield to keep UI responsive
    }
    let composed;
    if (currentLayout === "auto") composed = composeAuto(processed);
    else if (currentLayout === "strip") composed = composeStrip(processed);
    else if (currentLayout === "grid") composed = composeGrid(processed);
    else composed = composeCollage(processed);

    resultBlob = await canvasToBlob(composed);
    const url = URL.createObjectURL(resultBlob);
    resultImg.src = url; downloadBtn.href = url;
    result.style.display = "block"; status.textContent = "";
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    status.className = "status error"; status.textContent = err.message || "Something went wrong.";
  } finally { updateCount(); }
});

shareBtn.addEventListener("click", async () => {
  if (!resultBlob) return;
  const file = new File([resultBlob], "photobooth.jpg", { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Photobooth" }); } catch (e) {}
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(resultBlob); a.download = "photobooth.jpg";
    document.body.appendChild(a); a.click(); a.remove();
  }
});
againBtn.addEventListener("click", () => {
  queue.forEach((i) => URL.revokeObjectURL(i.url)); queue = [];
  if (resultImg.src.startsWith("blob:")) URL.revokeObjectURL(resultImg.src);
  resultImg.src = ""; resultBlob = null; result.style.display = "none";
  status.textContent = ""; renderThumbs();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

// Live reload: polls every 1.5s and reloads when index.html changes on the server
(function () {
  let tag = null;
  setInterval(async () => {
    try {
      const r = await fetch(location.href, { method: "HEAD", cache: "no-store" });
      const cur = r.headers.get("etag") || r.headers.get("last-modified");
      if (tag === null) { tag = cur; return; }
      if (cur && cur !== tag) location.reload();
    } catch (_) {}
  }, 1500);
})();
renderThumbs();
</script>
</body>
</html>
